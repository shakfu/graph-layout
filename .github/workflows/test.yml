name: test

# Nothing previously ran the test suite on a change: the only workflow was
# build-wheels.yml, gated on workflow_dispatch. This runs the same checks as
# `make qa` on every push and pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.13", "3.14"]
        include:
          # Spot-check the other platforms on one interpreter rather than
          # running the whole matrix everywhere.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The docs group is included so mkdocs is importable: tests/test_mkdocs_hooks.py
      # covers scripts/mkdocs_hooks.py, whose error type depends on whether mkdocs
      # is installed. Without it CI exercised a different path than local runs.
      - name: Sync dependencies
        run: uv sync --group docs --python ${{ matrix.python-version }}

      - name: Confirm the Cython extension built
        run: uv run python -c "from graph_layout import _speedups; print('_speedups:', _speedups.__file__)"

      - name: Run tests
        run: uv run pytest -q

  # The differential-testing oracles are the strongest correctness check in the
  # repository, and both were dark: ogdf-py is pinned to python < 3.14 while the
  # project's own venv is 3.14, and the wheel job installs neither oracle. This
  # job pins an interpreter where both are installable and fails if either is
  # missing, so the suites cannot silently skip.
  oracles:
    name: differential oracles (networkx + OGDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --python 3.13

      - name: Require both oracles to be importable
        run: |
          uv run python -c "import networkx; print('networkx', networkx.__version__)"
          uv run python -c "import ogdf; print('ogdf-py', ogdf.__version__)"

      - name: Run oracle suites
        run: uv run pytest -q tests/test_ogdf_oracle.py tests/test_planarity_regression.py tests/test_exhaustive_oracle.py

  quality:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check src/graph_layout tests

      - name: Lint
        run: uv run ruff check src/graph_layout tests

      - name: Type check
        run: uv run mypy --strict src/graph_layout

      # Fails if the count of errors suppressed by pyproject.toml's
      # `ignore_errors` rises above the Makefile baseline.
      - name: Type check (legacy suppression ratchet)
        run: make typecheck-legacy
