; Mirrors the [tool.mypy] settings in pyproject.toml, minus the
; `ignore_errors = true` applied to the ported-from-JavaScript cola modules.
;
; pyproject.toml silences those modules wholesale, so `make typecheck` reports
; success over code it never checked, and the suppressed count grew unnoticed
; from a documented 146 to 231. This config makes that number visible;
; `make typecheck-legacy` compares it against MYPY_LEGACY_BASELINE in the
; Makefile and fails if it climbs.
;
; The goal is a ratchet, not a clean bill of health: drive the baseline down,
; never up. When it reaches zero, delete this file and the ignore_errors block.
[mypy]
python_version = 3.9
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
check_untyped_defs = True
strict_equality = True
warn_redundant_casts = True
; Unlike pyproject.toml: an unused ignore in a module that is normally
; unchecked is not worth failing on here.
warn_unused_ignores = False
