[project]
name = "graph-layout"
version = "0.5.0"
description = "A collection of graph layout algorithms in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
keywords = ["graph", "layout", "constraints", "optimization", "visualization", "cola", "force-directed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.20.0",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
ilp = ["scipy>=1.9.0"]

[build-system]
requires = ["scikit-build-core>=0.10", "cython>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/graph_layout"]
cmake.version = ">=3.15"
cmake.build-type = "Release"
sdist.include = [
    "src/",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
sdist.exclude = [
    ".git/",
    ".venv/",
    "__pycache__/",
    "*.pyc",
    ".pytest_cache/",
    ".ruff_cache/",
    "build/",
    "dist/",
    "*.egg-info/",
]
wheel.exclude = [
    "*.c",
    "*.pyx",
    "*.pxd",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=1.14.1",
    # Not a runtime dependency -- it backs the optional [ilp] extra. Without it
    # in the dev environment the ILP compaction path sat at 15% coverage and the
    # scipy-dependent embedder tests skipped, so neither was ever exercised
    # locally or in CI.
    "scipy>=1.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.13.3",
    "Cython>=3.0.0",
    "matplotlib>=3.9.4",
    "twine>=5.0.0",
    "typing-extensions>=4.15.0",
    # Differential-testing oracle for the planarity suite (tests/test_planarity_regression.py).
    # Not a runtime dependency; the oracle tests skip gracefully if it is absent.
    "networkx>=3.0",
    # Second, independent differential-testing oracle backed by OGDF, used by
    # tests/test_ogdf_oracle.py. Not a runtime dependency. It is a compiled C++
    # extension, so it is pinned only where PyPI ships prebuilt wheels
    # (CPython 3.10-3.13 on Linux/macOS); elsewhere the oracle tests skip via the
    # guard in tests/_ogdf_oracle.py rather than forcing a from-source OGDF build.
    "ogdf-py>=0.1.1; sys_platform != 'win32' and python_version >= '3.10' and python_version < '3.14'",
]

# Documentation site (mkdocs.yml). Not needed for tests or the build, so it is a
# separate group: `uv run --group docs mkdocs serve`, or `make docs-serve`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/shakfu/graph-layout"
Repository = "https://github.com/shakfu/graph-layout"
Documentation = "https://shakfu.github.io/graph-layout"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["graph_layout"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Additional strictness
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Strict typing for new Pythonic API modules
[[tool.mypy.overrides]]
module = [
    "graph_layout.base",
    "graph_layout.types",
    "graph_layout.validation",
    "graph_layout.metrics",
    "graph_layout.force.*",
    "graph_layout.hierarchical.*",
    "graph_layout.circular.*",
    "graph_layout.spectral.*",
    "graph_layout.cola.adapter",
]
disallow_untyped_defs = true
warn_return_any = true

# Legacy cola modules have less strict typing (ported from JavaScript)
# These use dynamic patterns (fluent API with getter/setter overloads) that
# don't fit well with static typing.
#
# `ignore_errors` hides these files completely, so `make typecheck` reports
# success over code it never checked. The count is currently 158 errors in 5
# files under the project's own settings (was documented as 146; it grew
# unnoticed, which is the hazard of a blanket suppression). Dominated by
# union-attr (71) and arg-type (32) -- Optional handling and the Union types
# produced by the getter/setter pattern.
#
# `make typecheck-legacy` re-checks them via mypy-legacy.ini and fails if that
# number rises, so the suppression can shrink but not grow. Note that
# graph_layout.cola.adapter is deliberately NOT listed below: it appeared in
# both this list and the strict list above, and since the later section wins it
# was silently unchecked despite being declared strict.
[[tool.mypy.overrides]]
module = [
    "graph_layout.cola.layout",
    "graph_layout.cola.layout3d",
    "graph_layout.cola.batch",
    "graph_layout.cola.gridrouter",
    "graph_layout.cola.linklengths",
    "graph_layout.cola.handledisconnected",
    "graph_layout.cola.geom",
    "graph_layout.cola.rectangle",
    "graph_layout.cola.powergraph",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "graph_layout.cola.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Ignore naming conventions in modules using mathematical notation
[tool.ruff.lint.per-file-ignores]
"src/graph_layout/cola/*.py" = ["N803", "N806", "E741", "E731", "F841", "F401", "E501"]
# Spectral/force/hierarchical/orthogonal use matrix notation (A, D, L, H for matrices)
"src/graph_layout/spectral/*.py" = ["N806"]
"src/graph_layout/force/*.py" = ["N806"]
"src/graph_layout/hierarchical/*.py" = ["N806"]
"src/graph_layout/orthogonal/*.py" = ["N806"]
"src/graph_layout/planar/*.py" = ["N806"]
# Tests: allow mathematical names, lambdas, explicit boolean comparisons, unused setup vars, class args
"tests/*.py" = ["N803", "N806", "E741", "E731", "E712", "F841"]
# Scripts: allow class variable names
"scripts/*.py" = ["N803", "N806", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
